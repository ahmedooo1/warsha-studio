# Warsha Studio, workshop edition: the only file to add to the server's nginx.
# 1. replace atelier.example.fr with the real subdomain (its DNS A record points to this VPS)
# 2. sudo cp warsha-atelier.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/warsha-atelier.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx     (a failed test changes nothing: the running nginx keeps its config)
# 4. sudo certbot --nginx -d atelier.example.fr        (certbot adds the HTTPS lines below this file's server block)
# The app answers on 127.0.0.1:8090 only (APP_PORT in deploy/.env); nothing else on the server is changed.

server {
    listen 80;
    listen [::]:80;
    server_name atelier.example.fr;

    # quote PDFs and the assistant's photos travel in the request body
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the design assistant can take up to two minutes
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
