<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ورشة العرض: استوديو ثلاثي الأبعاد لنجاري الموبيليا لعرض المطابخ وغرف النوم بمقاسات الزبون، مع قائمة التقطيع وعرض السعر.">
<meta name="theme-color" content="#14191E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='2' y='5' width='26' height='22' rx='2' fill='%23fff' stroke='%2314191E' stroke-width='2'/%3E%3Cpath d='M2 16h26M15 5v22' stroke='%2314191E' stroke-width='2'/%3E%3Crect x='2' y='1' width='26' height='4' rx='1' fill='%23F4B400'/%3E%3C/svg%3E">
<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ورشة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: workshop app. Live 3D stage dominates, tool panel docked on the reading side; measuring-tape yellow is the only loud colour. */
:root{
  --bg:#EEF1F2; --panel:#FFFFFF; --sunk:#E4E8EA; --ink:#14191E; --muted:#5A646C; --line:#D5DBDF;
  --tape:#F4B400; --tape-ink:#1B1600; --stage:#DDE3E6; --stage2:#C9D1D6; --ok:#2E7D4F; --bad:#B23B2A;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --panel:#181C20; --sunk:#20252A; --ink:#E8ECEE; --muted:#9AA4AC; --line:#2A3137;
  --stage:#1A1F24; --stage2:#0E1114; --ok:#5DBB86; --bad:#E2705E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111417; --panel:#181C20; --sunk:#20252A; --ink:#E8ECEE; --muted:#9AA4AC; --line:#2A3137;
  --stage:#1A1F24; --stage2:#0E1114; --ok:#5DBB86; --bad:#E2705E; color-scheme:dark }
html,body{height:100%}
body{direction:rtl}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:400px minmax(0,1fr);grid-template-areas:"bar bar" "panel stage"}
.bar{grid-area:bar;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:0;white-space:nowrap}
.client{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px 6px 8px;min-width:0;max-width:260px}
.client .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.client span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:default}

.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--stage),var(--stage2))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dims{pointer-events:none}
.hud{position:absolute;inset-inline:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.hud > *{pointer-events:auto}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button svg{width:16px;height:16px}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.06);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .n{font-family:var(--f-num);font-size:12.5px}
.veil{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);transition:opacity .4s}
.veil.off{opacity:0;pointer-events:none}
.veil p{font-family:var(--f-display);font-size:18px;color:var(--muted)}

.panel{grid-area:panel;min-height:0;overflow-y:auto;border-inline-start:1px solid var(--line);background:var(--panel)}
.panel-in{padding-inline:18px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.ask h2{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.ask p.sub{margin:0;color:var(--muted);font-size:13.5px}
.ask textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px 12px;line-height:1.6}
.ask .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);border:1px dashed var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer}
.attach input{display:none}
.attach.has{border-style:solid;color:var(--ink);border-color:var(--ink)}
.ask .go{margin-inline-start:auto}
.note{margin:0;font-size:13.5px;line-height:1.6}
.note.err{color:var(--bad)}
.note.ok{color:var(--ok)}
.spin{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;margin-inline:-18px;padding-inline:18px}
.tabs button{border:0;background:none;padding:11px 4px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.pane{display:flex;flex-direction:column;gap:20px}
.grp{display:flex;flex-direction:column;gap:9px}
.grp > h3{margin:0;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp > h3 small{font-weight:400;color:var(--muted);font-size:13px}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.choice button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.choice svg{width:26px;height:26px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.sw button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.sw i{display:block;width:100%;aspect-ratio:1;max-width:100%;border-radius:9px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.sw button[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.meas{display:flex;flex-direction:column;gap:6px}
.meas .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meas label{font-size:14px;font-weight:500}
.num{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.num input{width:62px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-size:14px;padding:5px 2px}
.num span{font-size:12px;color:var(--muted);padding-inline:2px 8px}
.num input::-webkit-inner-spin-button{display:none}
.tape{direction:ltr;position:relative;height:34px}
.tape input{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;cursor:pointer}
.tape input::-webkit-slider-runnable-track{height:22px;border-radius:4px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px) left bottom/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 40px) left bottom/100% 11px no-repeat,
  var(--tape)}
.tape input::-moz-range-track{height:22px;border-radius:4px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px) left bottom/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 40px) left bottom/100% 11px no-repeat,
  var(--tape)}
.tape input::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:32px;margin-top:-5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--panel)}
.tape input::-moz-range-thumb{width:6px;height:32px;border:0;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--panel)}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:4px}
.sw-row label{font-size:14px}
.sw-row small{display:block;color:var(--muted);font-size:12.5px}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked + i{background:var(--ink)}
.toggle input:checked + i::after{transform:translateX(-18px)}
.toggle input:focus-visible + i{outline:2px solid var(--tape);outline-offset:2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:14px}
.list div + div{border-top:1px solid var(--line)}
.list b{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px;border-radius:10px;background:var(--ink);color:var(--bg)}
.total strong{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.prices{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.prices .num input{width:78px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
.field input,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 11px}
.hint{color:var(--muted);font-size:13px;margin:0}
.grow{flex:1;min-width:160px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpis span{font-size:13px;color:var(--muted)}
.kpis b{font-family:var(--f-num);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.kpis b.neg{color:var(--bad)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;text-align:start}
.doc:hover{border-color:var(--ink)}
.doc[disabled]{opacity:.6;cursor:default}
.doc svg{width:28px;height:28px;flex:none;color:var(--ink)}
.doc span{display:flex;flex-direction:column;min-width:0}
.doc b{font-weight:600;font-size:15px}
.doc small{color:var(--muted);font-size:12.5px}
.det{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.det summary{cursor:pointer;font-weight:600;font-size:14.5px}
.det[open] summary{margin-bottom:10px}
.shot.page{max-height:60vh;width:auto;max-width:100%;margin-inline:auto;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.manual{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13.5px}
.manual p{margin:0}
.elev{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:8px;overflow-x:auto}
.elev svg{display:block;width:100%;min-width:300px;height:auto}
svg.uv{direction:ltr;overflow:visible}
svg.uv *{vector-effect:non-scaling-stroke}
svg.uv .f{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
svg.uv .pl{fill:var(--ink);opacity:.7}
svg.uv .ln{stroke:var(--ink);stroke-width:1;fill:none}
svg.uv .hd{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
svg.uv .dk{fill:#2A2C2F;stroke:var(--ink);stroke-width:1}
svg.uv .win{fill:#5F5247}
svg.uv .gl{fill:#BFD6DE;fill-opacity:.75;stroke:var(--ink);stroke-width:.8}
svg.uv .mir{fill:#D9E2E5;stroke:var(--ink);stroke-width:.6}
svg.uv .op{fill:var(--sunk);stroke:var(--ink);stroke-width:1.2}
svg.uv .gap{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
svg.uv .wt{fill:var(--muted)}
svg.uv .wall{fill:var(--bg);stroke:var(--line);stroke-width:1}
svg.uv .flr{stroke:var(--ink);stroke-width:1.8}
svg.uv .cor{fill:url(#hz);stroke:var(--muted);stroke-width:.8}
svg.uv .hl{stroke:var(--muted);stroke-width:1}
svg.uv .lb{font-family:var(--f-num);fill:var(--muted);text-anchor:middle}
svg.uv .hit{fill:transparent;cursor:pointer}
svg.uv .u:hover .f,svg.uv .u:hover .op{fill:var(--sunk)}
svg.uv .u.on .lb{fill:var(--ink);font-weight:600}
svg.uv .selr{fill:var(--tape);fill-opacity:.2;stroke:var(--tape);stroke-width:2.5;pointer-events:none}
svg.uv .over .f,svg.uv .over .op,svg.uv .over .dk,svg.uv .over .gap{fill:var(--bad);fill-opacity:.2;stroke:var(--bad)}
svg.uv .over .lb{fill:var(--bad)}
.ucap{font-size:13.5px;color:var(--muted);margin:0}
.ucap b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.ucap.bad{color:var(--bad)} .ucap.bad b{color:var(--bad)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.ugrid button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:12.5px;line-height:1.3;text-align:center}
.ugrid button:hover{border-color:var(--muted)}
.ugrid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.ugrid svg{height:46px;width:auto;max-width:100%;display:block}
.ugrid.sm{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.ugrid.sm svg{height:32px}
.ued{border:2px solid var(--tape);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;scroll-margin:60px}
.ued-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ued-h b{font-family:var(--f-display);font-size:18px;font-weight:600}
.ued-h span{font-family:var(--f-num);font-size:14px}
.ued-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.ued-row .btn{display:inline-flex;align-items:center;gap:4px}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--sunk);width:36px;font-size:18px;line-height:1}
.stepper input{width:64px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-size:14px;padding:6px 2px}
.stepper input::-webkit-inner-spin-button{display:none}

.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,12,14,.45);padding:16px}
.sheet .box{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.sheet header h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}
.sheet .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.cl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px}
.cl img,.cl .ph{width:96px;height:62px;border-radius:7px;object-fit:cover;background:var(--sunk)}
.cl h4{margin:0;font-size:15px}
.cl p{margin:0;font-size:13px;color:var(--muted)}
.cl .tel{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate;user-select:all}
.cl .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cl .acts button{padding:5px 10px;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}
.shot{border-radius:10px;width:100%;display:block;border:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;opacity:0;transition:.25s;z-index:30;font-size:14px;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(260px,50%) 1fr;grid-template-areas:"bar" "stage" "panel"}
  .panel{border-inline-start:0;border-top:1px solid var(--line)}
  .bar{padding:8px 12px;gap:8px}
  .brand b{font-size:18px}
  @media (max-width:440px){.brand b{display:none}.client{max-width:170px}}
  .client{max-width:170px}
  .btn .lbl{display:none}
  .btn{padding:8px 10px}
  .seg button{padding:6px 8px;font-size:12.5px}
  .seg button .lbl{display:none}
  .panel-in{padding-inline:16px}
  .tabs{margin-inline:-16px;padding-inline:16px}
  .sheet{align-items:end;padding:0}
  .sheet .box{border-radius:16px 16px 0 0;width:100%;max-height:88%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">

  if (sel) { view.run = sel.run; view.lvl = sel.lvl; if (from3D) openTab('units'); }

}
function editUnits(fn){
  undo.push(JSON.stringify({auto: cfg.auto, units: cfg.units})); if (undo.length > 40) undo.shift();
  const u = JSON.parse(JSON.stringify(cfg.units)); fn(u);
  cfg = {...cfg, auto: false, units: sanitizeUnits(u)};
  build(); renderSpace();
}
function addUnit(t){
  const {r, U, talls} = unitsCtx(), lvl = PAL.ku.includes(t) ? 'u' : 'b', run = r.id, T = UNIT[t];
  const rem = availOf(r, talls, lvl) - sumW(U[lvl]), w = rem >= T.min && rem < T.w ? rem : T.w;
  editUnits(u => { const L = u[run][lvl]; const at = sel && sel.run === run && sel.lvl === lvl ? sel.i + 1 : L.length; L.splice(at, 0, {t, w}); sel = {run, lvl, i: at}; });
  view.lvl = lvl;
  if (rem < w) toast('لا توجد مساحة كافية، الزيادة تظهر بالأحمر في المخطط');
}
function setType(t){ if (!sel) return; editUnits(u => { const m = u[sel.run][sel.lvl][sel.i]; if (!m) return; m.t = t; m.w = clamp(m.w, UNIT[t].min, UNIT[t].max); }); }
function setWidth(v){ if (!sel) return; editUnits(u => { const m = u[sel.run][sel.lvl][sel.i]; if (m) m.w = Math.round(clamp(v || m.w, UNIT[m.t].min, UNIT[m.t].max)); }); }
function unitAction(act){
  if (!sel) return; const {run, lvl, i} = sel;
  editUnits(u => {
    const L = u[run][lvl], m = L[i]; if (!m) return;
    if (act === 'del') { L.splice(i, 1); sel = null; }
    else if (act === 'dup') { L.splice(i + 1, 0, {...m}); sel = {run, lvl, i: i + 1}; }
    else if (act === 'left' && i > 0) { [L[i - 1], L[i]] = [L[i], L[i - 1]]; sel = {run, lvl, i: i - 1}; }
    else if (act === 'right' && i < L.length - 1) { [L[i + 1], L[i]] = [L[i], L[i + 1]]; sel = {run, lvl, i: i + 1}; }
    else if (act[0] === 'w') m.w = clamp(m.w + Number(act.slice(1)), UNIT[m.t].min, UNIT[m.t].max);
  });
  if (act === 'del') toast('حُذفت الوحدة، ويمكنك التراجع');
}

const HW = {hinge:'مفصلة', runner:'سكة جارور (زوج)', dbox:'جسم جارور', handle:'مقبض', leg:'رجل قابلة للتعديل', lift:'آلية باب قلاب', rod:'قضيب تعليق', pin:'حامل رف', gola:'بروفيل Gola (متر)'};

const hingesFor = h => h <= 900 ? 2 : h <= 1600 ? 3 : 4;

  if (mat === 'carcass') return 'هيكل ملامين';

function cutList(c){

  const addHw = (k, q = 1) => { hw[k] = (hw[k] || 0) + q; };
  const addAp = (k, q = 1) => { ap[k] = (ap[k] || 0) + q; };

    a = Math.round(a); b = Math.round(b); if (a <= 0 || b <= 0 || qty <= 0) return;
    if (b > a) { [a, b] = [b, a]; [ea, eb] = [eb, ea]; }

    parts.push({code, kind, L: a, W: b, th, qty, mat, ea, eb});
  };
  const carcass = (code, W, H, D, o = {}) => {
    const m = o.mat || 'carcass', vis = !!o.mat;
    add(code, 'جانب', H, D, 18, 2, m, vis ? 2 : 1, vis ? 1 : 0);
    add(code, 'قاعدة', W - 36, D, 18, 1, m, 1, 0);
    if (o.rails) add(code, 'رافدة علوية', W - 36, 100, 18, 2, m, 1, 0); else add(code, 'سقف', W - 36, D, 18, 1, m, 1, 0);
    if (o.back !== false) add(code, 'ظهر', W - 4, H - 4, 3, 1, 'back');
    if (o.shelves) { add(code, 'رف', W - 38, D - 40, 18, o.shelves, m, 1, 0); addHw('pin', 4 * o.shelves); }
  };
  const doors = (code, W, h, n, f, kind = 'باب') => { add(code, kind, W / n - 3, h - 3, 18, n, F(f), 2, 2); addHw('hinge', n * hingesFor(h)); if (!gola) addHw('handle', n); };
  const drawer = (code, W, h, f) => { add(code, 'واجهة جارور', W - 3, h - 3, 18, 1, F(f), 2, 2); addHw('runner'); addHw('dbox'); if (!gola) addHw('handle'); };
  let units = 0, golaM = 0;
  if (c.room === 'kitchen') {
    const Ht = Math.min(c.height * 10 - 40, 2300), fh = gola ? 725 : 760, top = Math.min(Ht, 2060), t2 = Ht - top > 120 ? top : Ht;
    const hasB = c.layout !== 'I', hasC = c.layout === 'U';
    for (const r of runsOf(c)) {
      const U = c.units[r.id] || {b: [], u: []}, pb = placeBase(U.b, r.b), talls = pb.filter(m => m.fit && UNIT[m.t].tall).map(m => [m.s0, m.s1]), pu = placeUpper(U.u, r.u, talls);
      let plinth = 0, bi = 0, ui = 0;
      const corners = r.id === 'A' ? (hasB ? 1 : 0) + (hasC ? 1 : 0) : 0;
      for (let k = 0; k < corners; k++) { const code = 'A' + 'Z' + (k + 1); units++; carcass(code, 600, 760, 560, {rails: true, shelves: 1}); doors(code, 600, fh, 1, fid); addHw('leg', 4); plinth += 600; if (gola) golaM += 600; }
      for (const m of pb) {
        if (!m.fit || UNIT[m.t].gap) continue;
        const code = r.id + (++bi), W = m.w * 10;
        if (UNIT[m.t].tall) {

wallB: cm. Kitchen L/U: left wall length. Bedroom: room depth (wall holding the wardrobe). Range 180-500
wallC: cm. Kitchen U only: right wall length. Range 180-500
height: ceiling height cm, 230-320
upper: boolean, wall cabinets; tall: boolean, tall fridge column (both only used when units is null). island: boolean (needs wallA >= 280)
front: ${l(FRONTS)}
upperFront: same | any front id (two-tone kitchens)
finish: matte | gloss
worktop: ${l(TOPS)}
handle: ${l(HANDLES)}
splash: ${l(SPLASH)}
floor: ${l(FLOORS)}
wall: ${l(WALLS)}
wardrobeW: bedroom wardrobe width cm (<= wallB-20). mirror: boolean mirror doors. bedW: 140 | 160 | 180
fabric (bedroom headboard): ${l(FABRICS)}
units: the exact cabinets on each wall, or null to let the layout generate itself from the measurements.
  Shape: {"A":{"b":[{"t":type,"w":cm}],"u":[...]}, "B":{"b":[],"u":[]}, "C":{"b":[],"u":[]}, "W":{"b":[]}}
  A = main wall, B = left wall (L and U kitchens), C = right wall (U only), W = bedroom wardrobe. Each list runs left to right as seen standing in the room facing that wall.
  Base length to fill on each wall: A = wallA (I), wallA-60 (L), wallA-120 (U); corner cabinets are added automatically. B = wallB-60. C = wallC-60. W = wardrobe width, at most wallB. Base widths of a wall should add up exactly to its length.
  Upper lists start at the left end (A at 0, B at 0, C at 35 cm), automatically skip over tall columns, and use gaps to position items; total at most wallA, wallB-35, wallC-35.
  Base types (b): ${PAL.kb.map(t => t + ' (' + UNIT[t].n + ')').join(', ')}. fridge, pantry and oventall are tall columns.
  Upper types (u): ${PAL.ku.map(t => t + ' (' + UNIT[t].n + ')').join(', ')}. window only on A or B.
  Wardrobe types (W.b): ${PAL.wb.map(t => t + ' (' + UNIT[t].n + ')').join(', ')}.
  Widths in cm; typical cabinet 40 to 90, dishwasher 60, hob 60, sink 80, tall columns 60.`;
}
$('#askGo').onclick = async () => {
  const txt = $('#askText').value.trim(), note = $('#askNote');
  if (!txt && !askImage) { $('#askText').focus(); return; }
  if (!sampleFn) return;
  const btn = $('#askGo'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span><span>يصمّم…</span>'; note.hidden = false; note.className = 'note'; note.textContent = 'يقرأ طلب الزبون ويختار المقاسات والخامات.';
  const prompt = `You configure a 3D furniture visualizer used by a carpenter to show clients their future kitchen or bedroom.
Turn the client's request into a configuration. The request is usually in Arabic dialect (Levantine, Gulf, Maghrebi or Egyptian) and may mix in French or English words; measurements may be written like "3 متر و40" (=340 cm), "2.20" (=220 cm) or "متر ونص" (=150 cm).${askImage ? '\nThe attached image is a photo of the client\'s room or a hand sketch of the plan. Read any written dimensions and the layout from it, and use the visible style or colours as hints.' : ''}

Allowed fields and values:
${catalogText()}

Current configuration (keep any field the request does not mention):
${JSON.stringify(cfg)}

Client request:
"""${txt || '(see image)'}"""

For units: if the client asks for specific cabinets, appliances or their order (for example "جلاية جنب المجلى", "بدون خزائن علوية فوق الغاز", "خزانة مؤن طويلة"), return the full units for every wall, editing the current units when the room and walls stay the same. If the client only talks about style, colours or measurements, return "units": null.
Map colours and materials to the nearest allowed id (e.g. "خشبي فاتح" -> oak, "أسود" handles -> black, "بلا مقابض/push" -> gola, "رخام" -> marble). Choose sensible complementary values for anything the client leaves open.
Reply with only JSON of this shape: {"cfg": {<full configuration with every field>}, "note": "<one or two short sentences in Modern Standard Arabic telling the carpenter what you set and any assumption, e.g. a measurement you guessed>"}`;
  try {
    const opts = {modelTier: 'default'}; if (askImage) opts.images = [askImage];
    const res = await sampleFn.json(prompt, opts);
    if (!res || typeof res.cfg !== 'object') throw {code: 'invalid_json'};
    const hasUnits = !!res.cfg.units && typeof res.cfg.units === 'object', raw = {...res.cfg};
    if (!hasUnits) delete raw.units;
    undo.push(JSON.stringify({auto: cfg.auto, units: cfg.units}));
    cfg = sanitize(raw, cfg); cfg.auto = !hasUnits; sel = null;
    renderAll(); build(); setCam(camMode === 'top' ? 'angle' : camMode);
    note.className = 'note ok'; note.textContent = String(res.note || 'جُهّز التصميم.').slice(0, 400);
  } catch (e) {
    note.className = 'note err';
    note.textContent = e?.code === 'not_granted' ? 'لم يُسمح لهذه الصفحة باستخدام Claude. يمكنك السماح من قائمة الأذونات.' : e?.code === 'rate_limited' ? 'كثرت الطلبات، انتظر قليلاً ثم حاول.' : e?.code === 'images_unavailable' || e?.code === 'image_rejected' ? 'تعذّر إرسال الصورة، جرّب صورة JPG أو PNG أصغر أو أرسل الوصف وحده.' : 'لم أفهم الطلب جيداً. اذكر نوع الغرفة والمقاسات والألوان بوضوح ثم حاول.';
  }
  btn.disabled = false; btn.innerHTML = '<span>صمّم</span>';
};

['walnut','quartz','granite','concrete','oakTop','tile','terrazzo','cement'].forEach((id, i) => idle(() => texCanvas(id)));
window.__wr = {bq: buildQuote, bw: buildWorkshop, csv: () => buildCSV().blob.text(), get cfg(){ return cfg; }, set: (o) => { cfg = sanitize(o, cfg); renderAll(); build(); setCam(camMode, true); }, setCam, renderer, scene, camera};
})();
