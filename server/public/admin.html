<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>إدارة الورشة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{--ink:#14191E;--ink2:#3A434A;--mute:#5A646C;--line:#E1E5E8;--bg:#F2F4F5;--card:#fff;--tape:#F4B400;--bad:#B3261E;--good:#1E6B3A;--f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;--f-num:'IBM Plex Mono',ui-monospace,monospace;--f-display:'Reem Kufi',var(--f-body)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:5px solid var(--tape)}
header h1{font:700 21px var(--f-display);margin:0}header .who{margin-inline-start:auto;font-size:13px;opacity:.8}
header select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}header select option{color:#14191E}
header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:8px;font-size:13px}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;max-width:1240px;margin:0 auto;padding:18px}
nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:78px;align-self:start}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--ink2);font-weight:500}
nav button[aria-current=true]{background:var(--ink);color:#fff}nav button:hover:not([aria-current=true]){background:#E6E9EB}
nav hr{border:0;border-top:1px solid var(--line);margin:8px 0}
main section{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
h2{font:600 19px var(--f-display);margin:0 0 4px}.lead{color:var(--mute);margin:0 0 14px;max-width:70ch}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{font-weight:600;color:var(--mute);text-align:start;padding:8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#FAFBFB}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:embed;font-size:12.5px}
.b{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}
.b.g{background:#EEF1F3;color:var(--ink)}.b.y{background:var(--tape);color:var(--ink)}.b.r{background:#FBE9E7;color:var(--bad)}.b:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select{font:inherit;padding:8px 10px;border:1.5px solid #D5DADE;border-radius:8px;background:#fff}input:focus,select:focus{outline:none;border-color:var(--ink)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEF1F3}
.pill.sent{background:#E8F0FE;color:#1A4FA0}.pill.accepted,.pill.active,.pill.ok{background:#E3F4EA;color:var(--good)}.pill.cancelled,.pill.revoked,.pill.locked,.pill.bad{background:#FBE9E7;color:var(--bad)}.pill.reserved,.pill.expired{background:#FFF4D1;color:#7A5A00}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
.msg{min-height:20px;margin:6px 0;font-size:13.5px}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.sub{background:#F7F8F9;border-radius:9px;padding:10px 12px;margin:8px 0}
.empty{color:var(--mute);padding:14px 0}
.warn{border-inline-start:5px solid var(--bad);padding:10px 14px;background:#FFF6F5;border-radius:8px;margin:0 0 12px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}nav{position:static;flex-direction:row;overflow-x:auto;gap:4px}nav button{white-space:nowrap}nav hr{display:none}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header><h1>إدارة الورشة</h1><span class="who" id="who" data-notr></span><select id="lang" aria-label="اللغة" data-notr><option value="ar">العربية</option><option value="fr">Français</option><option value="tr">Türkçe</option></select><a href="/">المحرر</a></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><section><p class="empty">يحمّل…</p></section></main>
</div>
<script src="/js/i18n.js"></script>
<script src="/cloud/admin-i18n.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// what people typed (names, phones, devices) is never translated
const ud = s => `<span data-notr>${esc(s)}</span>`;
const tr = s => window.I18N ? I18N.t(s) : s;
const LG = () => (window.I18N?.lang || 'ar');
const loc = () => (LG() === 'tr' ? 'tr-TR' : 'fr-FR');
const dt = v => v ? new Date(v).toLocaleString(loc(), {dateStyle: 'short', timeStyle: 'short'}) : '-';
const d0 = v => v ? new Date(v).toLocaleDateString(loc()) : '-';
const cid = () => 'a' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function api(method, path, body){
  const h = {'x-warsha': '1', 'x-warsha-device': 'admin'}; if (body !== undefined) h['content-type'] = 'application/json';
  const r = await fetch('/api' + path, {method, headers: h, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'same-origin'});
  if (r.status === 401) { location.href = '/'; throw new Error('signed out'); }
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json().catch(() => ({})) : await r.blob();
  if (!r.ok) { const e = new Error(Array.isArray(data.message) ? data.message.join('، ') : data.message || ('خطأ ' + r.status)); e.status = r.status; e.data = data; throw e; }
  return {data, headers: r.headers};
}
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
const STATUS = {reserved: 'رقم محجوز دون ملف', sent: 'مُرسل', accepted: 'مقبول', cancelled: 'ملغى', replaced: 'مستبدل', active: 'فعّال', revoked: 'موقوف', expired: 'منتهٍ', locked: 'مقفل'};
const KIND = {save: 'تعديل', restore: 'استرجاع', delete: 'حذف', settings: 'إعدادات'};
let me = null;

const PAGES = [
  ['projects', 'المشاريع', false], ['quotes', 'عروض الأسعار', false], ['links', 'روابط الزبائن', false], ['trash', 'سلة المحذوفات', false],
  ['-'], ['settings', 'ترقيم العروض', true], ['users', 'المستخدمون والأجهزة', true], ['backup', 'النسخ الاحتياطي والتصدير', true], ['people', 'البيانات الشخصية', true], ['audit', 'السجل', true],
  ['-'], ['account', 'حسابي', false]
];
function nav(cur){
  $('#nav').innerHTML = PAGES.filter(p => p[0] === '-' || !p[2] || me.role === 'owner').map(p => p[0] === '-' ? '<hr>' : `<button data-p="${p[0]}" aria-current="${p[0] === cur}">${p[1]}</button>`).join('');
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) go(b.dataset.p); });
function go(p){ history.replaceState(null, '', '#' + p); nav(p); (VIEWS[p] || VIEWS.projects)().catch(err => { $('#main').innerHTML = `<section><p class="msg err">${esc(err.message)}</p></section>`; }); }
const sec = (title, lead, body) => `<section><h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${body}</section>`;

const VIEWS = {
  async projects(){
    const {data} = await api('GET', '/projects'), live = data.filter(p => !p.deletedAt);
    $('#main').innerHTML = sec('المشاريع', 'كل تصاميم الورشة كما هي على الخادم. افتح سجل أي مشروع لترى نسخه وتعود إلى إحداها، أو لتنشئ رابطاً للزبون.',
      `<div class="row"><input id="q" placeholder="بحث بالاسم أو الهاتف" style="min-width:260px"></div>
      <table><thead><tr><th>الزبون</th><th>الهاتف</th><th>آخر تعديل</th><th>بواسطة</th><th>النسخة</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="detail"></div>`);
    const draw = f => { $('#rows').innerHTML = live.filter(p => !f || (p.name + ' ' + p.phone).toLowerCase().includes(f)).map(p => `<tr><td>${ud(p.name)} ${p.variant ? `<span class="pill">${ud(p.variant)}</span>` : ''}</td><td class="num">${ud(p.phone)}</td><td>${dt(p.updatedAt)}</td><td>${ud(p.user || '')} <small>${ud(p.device)}</small></td><td class="num">${p.rev}</td><td><button class="b g" data-h="${esc(p.id)}">السجل والروابط</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">لا مشاريع</td></tr>'; };
    draw(''); $('#q').oninput = e => draw(e.target.value.trim().toLowerCase());
    $('#rows').onclick = e => { const b = e.target.closest('[data-h]'); if (b) projectDetail(live.find(p => p.id === b.dataset.h)); };
  },
  async quotes(){
    const {data} = await api('GET', '/quotes?limit=500');
    $('#main').innerHTML = sec('سجل عروض الأسعار', 'كل عرض صدر برقمه، مجمّداً كما أُرسل: التصميم والأسعار والضريبة وهوية الورشة. لا يُعدَّل ولا يُحذف؛ القبول والإلغاء والاستبدال تُضاف إليه كأحداث.',
      `<table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الزبون</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead><tbody>${data.map(q => `<tr><td class="num">${esc(q.number)}</td><td>${dt(q.createdAt)}</td><td>${ud(q.clientName)}</td><td class="num">${esc(q.total)} ${esc(q.currency)}</td><td><span class="pill ${q.status}">${STATUS[q.status] || q.status}</span></td>
      <td><div class="row" style="margin:0">${q.hasPdf ? `<button class="b g" data-pdf="${q.id}" data-n="${esc(q.number)}">PDF</button>` : ''}${q.status === 'sent' ? `<button class="b g" data-ev="${q.id}:accepted">قبول</button>` : ''}${['sent', 'accepted'].includes(q.status) ? `<button class="b r" data-ev="${q.id}:cancelled">إلغاء</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="6" class="empty">لا عروض بعد. تصدر العروض من المحرر: السعر، ثم عرض سعر للزبون، ثم «إصدار عرض سعر رسمي مرقّم».</td></tr>'}</tbody></table><p class="msg" id="m"></p>`);
    $('#main').onclick = async e => {
      const p = e.target.closest('[data-pdf]'); if (p) { const r = await api('GET', `/quotes/${p.dataset.pdf}/pdf`); download(r.data, p.dataset.n + '.pdf'); return; }
      const ev = e.target.closest('[data-ev]'); if (ev) {
        const [id, type] = ev.dataset.ev.split(':'); const note = type === 'cancelled' ? prompt(tr('سبب الإلغاء (اختياري)')) : '';
        if (note === null) return;
        try { await api('POST', `/quotes/${id}/events`, {type, note: note || ''}); VIEWS.quotes(); } catch (err) { $('#m').className = 'msg err'; $('#m').textContent = err.message; }
      }
    };
  },
  async links(){
    const {data} = await api('GET', '/share');
    $('#main').innerHTML = sec('روابط الزبائن', 'روابط للعرض فقط، لمدة محددة. أوقف أي رابط فوراً عند الحاجة. لا يحتفظ الخادم بالرابط نفسه، فلا يمكن عرضه مرة ثانية.',
      `<table><thead><tr><th>المشروع</th><th>أُنشئ</th><th>ينتهي</th><th>رمز</th><th>المشاهدات</th><th>الحالة</th><th></th></tr></thead><tbody>${data.map(l => `<tr><td>${ud(l.name || l.projectId)} ${l.quoteId ? '<span class="pill">مع عرض سعر</span>' : ''}</td><td>${dt(l.createdAt)}</td><td>${d0(l.expiresAt)}</td><td>${l.pin ? 'نعم' : 'لا'}</td><td class="num">${l.views}</td><td><span class="pill ${l.state}">${STATUS[l.state]}</span></td><td>${l.state === 'active' ? `<button class="b r" data-rv="${l.id}">إيقاف</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">لا روابط</td></tr>'}</tbody></table>`);
    $('#main').onclick = async e => { const b = e.target.closest('[data-rv]'); if (b && confirm(tr('إيقاف هذا الرابط الآن؟'))) { await api('POST', `/share/${b.dataset.rv}/revoke`); VIEWS.links(); } };
  },
  async trash(){
    const {data} = await api('GET', '/trash');
    $('#main').innerHTML = sec('سلة المحذوفات', 'المشاريع المحذوفة تبقى هنا مع سجلها ثم تُحذف نهائياً بعد مدة السلة. المشاريع المرتبطة بعرض سعر لا تُحذف نهائياً أبداً.',
      `<table><thead><tr><th>المشروع</th><th>حُذف</th><th></th></tr></thead><tbody>${data.map(p => `<tr><td>${ud(p.name)} ${p.variant ? `<span class="pill">${ud(p.variant)}</span>` : ''}</td><td>${dt(p.deletedAt)}</td><td><button class="b y" data-back="${esc(p.id)}">إرجاع</button></td></tr>`).join('') || '<tr><td colspan="3" class="empty">السلة فارغة</td></tr>'}</tbody></table><p class="msg" id="m"></p>`);
    $('#main').onclick = async e => {
      const b = e.target.closest('[data-back]'); if (!b) return;
      const {data: vs} = await api('GET', `/projects/${b.dataset.back}/versions`), v = vs.find(x => x.kind === 'delete') || vs[0];
      await api('POST', `/projects/${b.dataset.back}/versions/${v.id}/restore`, {changeId: cid()});
      $('#m').className = 'msg ok'; $('#m').textContent = 'رجع المشروع، ويظهر على الأجهزة عند مزامنتها.'; setTimeout(VIEWS.trash, 900);
    };
  },
  async users(){
    const [{data: us}, {data: ss}] = await Promise.all([api('GET', '/users'), api('GET', '/users/sessions')]);
    $('#main').innerHTML = sec('المستخدمون', 'صاحب الورشة يدير الأسعار والمستخدمين والنسخ والبيانات الشخصية. العامل يصمّم ويحفظ ويصدر العروض. لا يُحذف حساب، بل يوقف، فيبقى السجل سليماً.',
      `<table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>آخر دخول</th><th>الحالة</th><th></th></tr></thead><tbody>${us.map(u => `<tr><td>${ud(u.name)}</td><td class="num">${esc(u.email)}</td><td>${u.role === 'owner' ? 'صاحب الورشة' : 'عامل'}</td><td>${dt(u.lastLoginAt)}</td><td><span class="pill ${u.active ? 'ok' : 'bad'}">${u.active ? 'فعّال' : 'موقوف'}</span></td>
        <td><div class="row" style="margin:0"><button class="b g" data-act="${u.id}:${u.active ? 0 : 1}">${u.active ? 'إيقاف' : 'تفعيل'}</button><button class="b g" data-pw="${u.id}">كلمة مرور جديدة</button></div></td></tr>`).join('')}</tbody></table>
      <form id="nu" class="sub"><b>مستخدم جديد</b><div class="row"><input name="name" placeholder="الاسم" required maxlength="80"><input name="email" type="email" placeholder="البريد" required dir="ltr"><select name="role"><option value="staff">عامل</option><option value="owner">صاحب الورشة</option></select><input name="password" type="password" placeholder="كلمة مرور (10 أحرف على الأقل)" minlength="10" required dir="ltr"><button class="b">إضافة</button></div></form><p class="msg" id="m"></p>`)
      + sec('الأجهزة المتصلة', 'كل جلسة مفتوحة على جهاز. أنهِ جلسة هاتف ضائع أو عامل ترك العمل فوراً.',
      `<table><thead><tr><th>المستخدم</th><th>الجهاز</th><th>بدأت</th><th>آخر نشاط</th><th></th></tr></thead><tbody>${ss.map(s => `<tr><td class="num">${esc(s.email)}</td><td><small>${ud(s.device.slice(0, 80))}</small></td><td>${dt(s.createdAt)}</td><td>${dt(s.lastSeenAt)}</td><td>${s.current ? '<span class="pill ok">هذا الجهاز</span>' : `<button class="b r" data-end="${s.id}">إنهاء</button>`}</td></tr>`).join('')}</tbody></table>`);
    const m = (t, ok) => { $('#m').className = 'msg ' + (ok ? 'ok' : 'err'); $('#m').textContent = t; };
    $('#nu').onsubmit = async e => { e.preventDefault(); try { await api('POST', '/users', Object.fromEntries(new FormData(e.target))); VIEWS.users(); } catch (err) { m(err.message); } };
    $('#main').onclick = async e => {
      const a = e.target.closest('[data-act]'); if (a) { const [id, on] = a.dataset.act.split(':'); try { await api('PATCH', `/users/${id}`, {active: on === '1'}); VIEWS.users(); } catch (err) { m(err.message); } return; }
      const p = e.target.closest('[data-pw]'); if (p) { const pw = prompt(tr('كلمة المرور الجديدة (10 أحرف على الأقل). تنتهي كل جلسات هذا المستخدم.')); if (!pw) return; try { await api('PATCH', `/users/${p.dataset.pw}`, {password: pw}); m('تغيّرت كلمة المرور', true); } catch (err) { m(err.message); } return; }
      const s = e.target.closest('[data-end]'); if (s) { await api('DELETE', `/users/sessions/${s.dataset.end}`); VIEWS.users(); }
    };
  },
  async backup(){
    const {data: b} = await api('GET', '/admin/backup-status');
    const st = b.known === false ? `<div class="warn">لا يوجد تقرير نسخ احتياطي على الخادم. النسخ الخارجية غير مفعّلة أو لم تعمل بعد.</div>`
      : `${b.warn ? '<div class="warn">انتبه: آخر نسخة قديمة أو فشلت، أو فشل اختبار الاسترجاع.</div>' : ''}<div class="kv"><span>آخر نسخة</span><b>${dt(b.lastBackupAt)} <span class="pill ${b.lastBackupOk ? 'ok' : 'bad'}">${b.lastBackupOk ? 'نجحت' : 'فشلت'}</span></b>
        <span>مكان النسخ</span><b class="num">${esc(b.repository || '-')}</b><span>آخر اختبار استرجاع</span><b>${dt(b.lastRestoreTestAt)} <span class="pill ${b.lastRestoreTestOk ? 'ok' : 'bad'}">${b.lastRestoreTestOk ? 'نجح' : 'فشل'}</span></b>
        <span>ما استُرجع في الاختبار</span><b>${esc(b.restoreTestDetail || '-')}</b><span>عدد النسخ المحفوظة</span><b class="num">${esc(b.snapshots ?? '-')}</b></div>`;
    $('#main').innerHTML = sec('النسخ الاحتياطي', 'نسخة مشفّرة من قاعدة البيانات كل ليلة إلى خادم تخزين خارج هذا الخادم، واختبار استرجاع آلي كل أسبوع في قاعدة مؤقتة.', st)
      + sec('تصدير كل بيانات الورشة', '<span>ملف مضغوط واحد فيه كل المشاريع والأسعار وهوية الورشة بصيغة النسخة الاحتياطية التي يستوردها المحرر نفسه، وكل عروض الأسعار مع بصمتها، والسجل، ونسخ للجداول تفتح في برنامج الجداول.</span> <span>هذا الملف يكفي لمتابعة العمل بالنسخة المستقلة دون الخادم.</span>',
      `<div class="row"><button class="b y" id="ex">تنزيل التصدير الكامل</button></div><p class="msg" id="m"></p>`);
    $('#ex').onclick = async () => { $('#ex').disabled = true; $('#m').textContent = 'يجهّز الملف…'; try { const r = await api('GET', '/admin/export'); download(r.data, `warsha-export-${new Date().toISOString().slice(0, 10)}.zip`); $('#m').className = 'msg ok'; $('#m').textContent = 'نُزّل الملف. احفظه في مكان آمن.'; } catch (err) { $('#m').className = 'msg err'; $('#m').textContent = err.message; } $('#ex').disabled = false; };
  },
  async people(){
    $('#main').innerHTML = sec('البيانات الشخصية للزبائن', 'للرد على طلب زبون: الاطلاع على بياناته أو نقلها (تصدير)، أو محوها. المشاريع المرتبطة بعرض سعر تبقى محفوظة لأن العرض مستند تجاري يجب الاحتفاظ به (حجز قانوني)، ويوضح الجواب ذلك. النسخ الاحتياطية القديمة تحتفظ بالبيانات حتى تنتهي مدتها.',
      `<form id="f" class="row"><input name="q" placeholder="اسم أو رقم هاتف" required minlength="2" style="min-width:260px"><button class="b">بحث</button></form><div id="res"></div>`)
      + sec('مدد الاحتفاظ', 'قائمة بما تجاوز مدة الاحتفاظ ليقرر صاحب الورشة. لا يُحذف شيء تلقائياً.', `<div id="ret"><p class="empty">يحمّل…</p></div>`);
    $('#f').onsubmit = async e => {
      e.preventDefault(); const q = new FormData(e.target).get('q');
      const {data} = await api('GET', '/admin/people?q=' + encodeURIComponent(q));
      $('#res').innerHTML = `<table><thead><tr><th><input type="checkbox" id="all"></th><th>المشروع</th><th>الهاتف</th><th>آخر تعديل</th><th></th></tr></thead><tbody>${data.designs.map(d => `<tr><td><input type="checkbox" value="${esc(d.id)}" class="pick"></td><td>${ud(d.name)} ${d.variant ? `<span class="pill">${ud(d.variant)}</span>` : ''} ${d.deletedAt ? '<span class="pill">في السلة</span>' : ''}</td><td class="num">${ud(d.phone)}</td><td>${d0(d.updatedAt)}</td><td>${d.legalHold ? '<span class="pill reserved">حجز قانوني: مرتبط بعرض سعر</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">لا نتائج</td></tr>'}</tbody></table>
        ${data.quotes.length ? `<p class="lead">عروض أسعار تحمل هذا الاسم أو الرقم: ${data.quotes.map(q => `<span class="num">${esc(q.number)}</span>`).join('، ')}</p>` : ''}
        <div class="row"><button class="b g" id="pex">تصدير بيانات المحدد</button><input id="conf" placeholder="اكتب ERASE للتأكيد" dir="ltr" style="width:180px"><button class="b r" id="per">محو المحدد نهائياً</button></div><p class="msg" id="m"></p>`;
      const picked = () => [...document.querySelectorAll('.pick:checked')].map(x => x.value);
      $('#all').onchange = e => document.querySelectorAll('.pick').forEach(x => x.checked = e.target.checked);
      $('#pex').onclick = async () => { const ids = picked(); if (!ids.length) return; const r = await api('POST', '/admin/people/export', {ids}); download(r.data, 'donnees-client.json'); };
      $('#per').onclick = async () => {
        const ids = picked(), m = $('#m'); if (!ids.length) return;
        try { const {data: r} = await api('POST', '/admin/people/erase', {ids, confirm: $('#conf').value.trim()});
          m.className = 'msg ok'; m.textContent = ({ar: `مُحي من المشاريع: ${r.erased.length}.`, fr: `Projets effacés : ${r.erased.length}.`, tr: `Silinen proje: ${r.erased.length}.`})[LG()] + (r.legalHold.length ? ({ar: ` بقي مرتبطاً بعرض سعر (حجز قانوني): ${r.legalHold.length}.`, fr: ` Conservés car liés à un devis (conservation légale) : ${r.legalHold.length}.`, tr: ` Teklife bağlı olduğu için saklanan (yasal saklama): ${r.legalHold.length}.`})[LG()] : ''); }
        catch (err) { m.className = 'msg err'; m.textContent = err.message; }
      };
    };
    const {data: r} = await api('GET', '/admin/retention');
    $('#ret').innerHTML = `<div class="kv"><span>زبائن محتملون بلا عرض سعر</span><b><span class="num">${r.rules.prospectYears}</span> سنوات بعد آخر نشاط</b><span>زبائن لهم عرض سعر</span><b><span class="num">${r.rules.clientYears}</span> سنوات بعد آخر عرض أو حدث</b><span>عروض الأسعار</span><b><span class="num">${r.rules.quotesYears}</span> سنوات</b><span>سلة المحذوفات</span><b><span class="num">${r.trashPurgedAfterDays}</span> يوماً</b></div>
      <h3>زبائن محتملون تجاوزوا المدة <span class="num">${r.prospects.length}</span></h3>${r.prospects.length ? `<table><tbody>${r.prospects.map(p => `<tr><td>${ud(p.name)}</td><td>${d0(p.lastActivity)}</td></tr>`).join('')}</tbody></table><p class="lead">ابحث عنهم أعلاه بالاسم ثم صدّر أو امحُ.</p>` : '<p class="empty">لا أحد</p>'}
      <h3>زبائن لهم عرض سعر تجاوزوا المدة <span class="num">${r.clientsPastKeeping.length}</span></h3>${r.clientsPastKeeping.length ? `<table><tbody>${r.clientsPastKeeping.map(p => `<tr><td>${ud(p.name)}</td><td>${d0(p.lastActivity)}</td></tr>`).join('')}</tbody></table><p class="lead">تبقى مشاريعهم ما دام عرض السعر يجب حفظه.</p>` : '<p class="empty">لا أحد</p>'}
      <p class="lead">عروض أسعار تجاوزت عشر سنوات: <span class="num">${r.quotesPastTenYears}</span></p>`;
  },
  async audit(){
    const {data} = await api('GET', '/admin/audit?limit=300');
    $('#main').innerHTML = sec('السجل', 'من فعل ماذا ومتى. لا يحتوي بيانات شخصية للزبائن، ولا يمكن تعديله أو حذفه.',
      `<table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>العنصر</th><th>تفاصيل</th></tr></thead><tbody>${data.map(a => `<tr><td>${dt(a.at)}</td><td>${ud(a.user || '-')}</td><td class="num">${esc(a.action)}</td><td class="num">${esc(a.entity)} ${esc(String(a.entityId).slice(0, 12))}</td><td class="num">${esc(JSON.stringify(a.meta)).slice(0, 120)}</td></tr>`).join('')}</tbody></table>`);
  },
  async settings(){
    const {data: st} = await api('GET', '/settings'), pr = st.prices || {}, year = new Date().getFullYear();
    const {data: qs} = await api('GET', '/quotes?limit=1');
    $('#main').innerHTML = sec('ترقيم العروض', 'حروف تسبق رقم كل عرض سعر، ثم السنة ثم رقم متسلسل يبدأ من 1 كل سنة. يتغير ما يأتي من العروض فقط؛ العروض التي صدرت تبقى بأرقامها.',
      `<form id="qf" class="row"><label>البادئة <input name="p" value="${esc(pr.quotePrefix || 'D')}" maxlength="4" pattern="[A-Za-z]{1,4}" required dir="ltr" style="width:90px"></label><button class="b">حفظ</button></form>
      <p class="lead">العرض التالي يشبه: <b class="num" id="qx"></b></p>${qs[0] ? `<p class="lead">آخر عرض صدر: <b class="num">${esc(qs[0].number)}</b></p>` : ''}<p class="msg" id="m"></p>`);
    const show = () => { $('#qx').textContent = `${($('#qf [name=p]').value || 'D').replace(/[^A-Za-z]/g, '').slice(0, 4) || 'D'}${year}-0001`; };
    show(); $('#qf [name=p]').oninput = show;
    $('#qf').onsubmit = async e => {
      e.preventDefault(); const p = new FormData(e.target).get('p').replace(/[^A-Za-z]/g, '').slice(0, 4);
      try { await api('PUT', '/settings', {baseRev: st.rev, changeId: cid(), prices: {...pr, quotePrefix: p}, fab: st.fab || {}}); $('#m').className = 'msg ok'; $('#m').textContent = tr('حُفظ. يصل إلى أجهزة الورشة عند مزامنتها.'); }
      catch (err) { $('#m').className = 'msg err'; $('#m').textContent = err.status === 409 ? tr('تغيّرت الإعدادات على جهاز آخر. أعد فتح الصفحة.') : err.message; }
    };
  },
  async account(){
    $('#main').innerHTML = sec('حسابي', `${ud(me.name)} <span class="num">${esc(me.email)}</span>`,
      `<form id="pw" class="sub"><b>تغيير كلمة المرور</b><div class="row"><input name="current" type="password" placeholder="الحالية" required dir="ltr"><input name="next" type="password" placeholder="الجديدة (10 أحرف على الأقل)" minlength="10" required dir="ltr"><button class="b">تغيير</button></div><p class="lead">تنتهي جلساتك على الأجهزة الأخرى.</p></form><p class="msg" id="m"></p>
      <div class="row"><button class="b g" id="out">تسجيل الخروج من هذا الجهاز</button></div>`);
    $('#pw').onsubmit = async e => { e.preventDefault(); try { await api('POST', '/auth/password', Object.fromEntries(new FormData(e.target))); $('#m').className = 'msg ok'; $('#m').textContent = 'تغيّرت كلمة المرور.'; e.target.reset(); } catch (err) { $('#m').className = 'msg err'; $('#m').textContent = err.message; } };
    $('#out').onclick = async () => { await api('POST', '/auth/logout', {}); location.href = '/'; };
  }
};

async function projectDetail(p){
  const [{data: vs}, {data: ls}, {data: qs}] = await Promise.all([api('GET', `/projects/${p.id}/versions`), api('GET', `/share?projectId=${encodeURIComponent(p.id)}`), api('GET', `/quotes?projectId=${encodeURIComponent(p.id)}`)]);
  $('#detail').innerHTML = `<div class="sub" id="det"><h2>${ud(p.name)}</h2>
    <h3>النسخ <span class="num">${vs.length}</span></h3><table><thead><tr><th>النسخة</th><th>العملية</th><th>الوقت</th><th>بواسطة</th><th></th></tr></thead><tbody>${vs.map(v => `<tr><td class="num">${v.rev}</td><td>${KIND[v.kind] || v.kind} ${v.pinned ? '<span class="pill sent">مرتبطة بعرض سعر</span>' : ''}</td><td>${dt(v.createdAt)}</td><td>${ud(v.user || '')} <small>${ud(v.device)}</small></td><td>${v.rev !== p.rev ? `<button class="b g" data-rs="${v.id}">العودة إليها</button>` : '<span class="pill ok">الحالية</span>'}</td></tr>`).join('')}</tbody></table>
    <p class="lead">العودة إلى نسخة تنشئ نسخة جديدة بمحتواها؛ لا تضيع النسخة الحالية.</p>
    <h3>عروض الأسعار</h3>${qs.length ? qs.map(q => `<span class="num">${esc(q.number)}</span> <span class="pill ${q.status}">${STATUS[q.status]}</span>`).join('، ') : '<p class="empty">لا عروض</p>'}
    <h3>رابط للزبون</h3><div class="row"><select id="lq"><option value="">التصميم الحالي (يتحدث مع التعديلات)</option>${qs.filter(q => q.hasPdf).map(q => `<option value="${q.id}">عرض السعر ${esc(q.number)} (مجمّد)</option>`).join('')}</select>
      <input id="ld" type="number" min="1" max="180" value="30" style="width:80px"> يوماً <input id="lp" placeholder="رمز اختياري" inputmode="numeric" maxlength="8" dir="ltr" style="width:130px"><button class="b y" id="lg">أنشئ الرابط</button></div><div id="lo"></div>
    ${ls.length ? `<p class="lead">روابط هذا المشروع: ${ls.map(l => `<span class="pill ${l.state}">${STATUS[l.state]}</span>`).join(' ')}</p>` : ''}<p class="msg" id="dm"></p></div>`;
  $('#det').scrollIntoView({behavior: 'smooth'});
  $('#det').onclick = async e => {
    const r = e.target.closest('[data-rs]'); if (r) { if (!confirm(tr('العودة إلى هذه النسخة؟'))) return; await api('POST', `/projects/${p.id}/versions/${r.dataset.rs}/restore`, {changeId: cid()}); $('#dm').className = 'msg ok'; $('#dm').textContent = 'تمت العودة. تظهر على الأجهزة عند مزامنتها.'; p.rev++; setTimeout(() => projectDetail(p), 700); return; }
    if (e.target.id === 'lg') {
      const body = {projectId: p.id, days: +$('#ld').value || 30}; if ($('#lq').value) body.quoteId = $('#lq').value; if ($('#lp').value.trim()) body.pin = $('#lp').value.trim();
      try { const {data} = await api('POST', '/share', body); $('#lo').innerHTML = `<div class="row"><input readonly value="${esc(data.url)}" dir="ltr" style="flex:1;min-width:0" id="lu"><button class="b g" id="lc">نسخ</button></div><p class="lead">انسخه الآن: لا يظهر مرة ثانية. ينتهي <span class="num">${d0(data.expiresAt)}</span></p>`; $('#lc').onclick = () => navigator.clipboard.writeText(data.url).then(() => $('#lc').textContent = 'نُسخ'); }
      catch (err) { $('#dm').className = 'msg err'; $('#dm').textContent = err.message; }
    }
  };
}

(async () => {
  const r = await fetch('/api/auth/state', {credentials: 'same-origin'}).then(x => x.json()).catch(() => null);
  if (!r?.user) { location.href = '/'; return; }
  me = r.user;
  const who = () => { $('#who').textContent = `${me.name} · ${tr(me.role === 'owner' ? 'صاحب الورشة' : 'عامل')}`; };
  if (window.I18N) { I18N.applyDoc(); I18N.start(); $('#lang').value = I18N.lang; $('#lang').onchange = e => { I18N.setLang(e.target.value); who(); go(location.hash.slice(1) || 'projects'); }; } else $('#lang').hidden = true;
  who();
  go(location.hash.slice(1) || 'projects');
})();
</script>
</body>
</html>
